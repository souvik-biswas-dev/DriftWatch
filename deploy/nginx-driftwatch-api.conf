# nginx vhost for the DriftWatch backend, for VPSes where nginx already owns
# ports 80/443. Pair it with docker-compose.host-proxy.yml.
#
#   sudo cp nginx-driftwatch-api.conf /etc/nginx/sites-available/driftwatch-api
#   sudo ln -s /etc/nginx/sites-available/driftwatch-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d driftwatch-api.example.com
#
# certbot rewrites this file to add the TLS listener and the http→https
# redirect, so apply it over plain HTTP first.

server {
    listen 80;
    listen [::]:80;

    server_name driftwatch-api.example.com;   # ← your API domain

    # Agent pushes carry a JSON snapshot of every container on the host.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The backend reads this to build the GitHub OAuth redirect_uri when
        # BACKEND_URL is not set explicitly.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Deliberately no add_header Access-Control-* here: the backend emits its
    # own CORS headers from ALLOWED_ORIGIN, and a duplicated
    # Access-Control-Allow-Origin makes browsers reject the response.
}
